name: starter-health

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and health tests
        run: ./scripts/health.sh
      - name: Confirm every milestone fails in the untouched starter
        run: ./scripts/verify-milestones.sh starter
      - name: Audit public repository contents
        run: ./scripts/audit-public.sh
