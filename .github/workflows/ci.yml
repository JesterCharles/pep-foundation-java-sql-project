name: project-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and health tests
        run: ./scripts/health.sh
      - name: Milestone progress (reports PASS/FAIL per milestone; unfinished milestones do not fail this step)
        run: ./scripts/verify-milestones.sh progress
      - name: Privacy scan of tracked files and history
        run: ./scripts/audit-public.sh
